<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crappy Cloud - Tech Buzzword Visualizer</title>
  <style>
    * { margin: 0; padding: 0; }
    html { height: 100%; }
    body {
      background: rgb(125,185, 232);
      background: transparent linear-gradient(45deg, rgb(30, 87, 153) 0%, rgb(125, 185, 232) 100%);
      height: 100%;
      overflow: hidden;
    }

    .shit {
      animation-iteration-count: 1;
      position: absolute;
    }

    @keyframes right {
      from {
        left: -300px;
      }

      to {
        left: 100%;
      }
    }

    @keyframes left {
      from {
        left: 100%;
      }

      to {
        left: -300px;
      }
    }

    @keyframes buzz0 {
      from { left: -300px; }
      to { left: 120%; transform: rotate(260deg); }
    }

    @keyframes buzz1 {
      from { left: -300px; transform: rotate(180deg) }
      to { left: 120%; transform: rotate(-180deg); }
    }

    @keyframes buzz2 {
      from { left: 40%; }
      to { left: 50%; transform: rotate(10000deg); }
    }

    @keyframes buzz3 {
      from { left: 40%; transform: scale(0); }
      to { left: 50%; transform: scale(10); }
    }

    @keyframes buzz4 {
      from { left: 100%; top: 0px; }
      to { left: 0%; transform: rotate(10000deg); }
    }

    h1 {
      color: darkred;
      z-index: 100;
      position: absolute;
      white-space: nowrap;
      font-size: 100px;
    }
  </style>
</head>
<body>
  <img style="display: none;" src="crappy_cloud_1.png" class="shit">

  <script type="module" src="./src/main.js"></script>
</body>
</html>
